<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - MySchool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { text-align: center; padding: 2rem; }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; color: #1f2937; margin-bottom: 0.5rem; }
        p { color: #6b7280; margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background: #1e40af; color: #fff; border-radius: 0.5rem; text-decoration: none; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; }
        .btn:hover { background: #1e3a8a; }
        .pending { margin-top: 2rem; padding: 1rem; background: #fef3c7; border-radius: 0.5rem; color: #92400e; font-size: 0.875rem; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>Please check your internet connection and try again.</p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
        <div class="pending" id="pending-info">
            <strong>Pending Changes:</strong>
            <span id="pending-count">0</span> item(s) will sync when you're back online.
        </div>
    </div>
    <script>
        // Show pending sync count if any
        try {
            const request = indexedDB.open('myschool-sync', 1);
            request.onsuccess = () => {
                const db = request.result;
                if (db.objectStoreNames.contains('queue')) {
                    const tx = db.transaction('queue', 'readonly');
                    const countReq = tx.objectStore('queue').count();
                    countReq.onsuccess = () => {
                        if (countReq.result > 0) {
                            document.getElementById('pending-count').textContent = countReq.result;
                            document.getElementById('pending-info').style.display = 'block';
                        }
                    };
                }
            };
        } catch(e) {}
    </script>
</body>
</html>
